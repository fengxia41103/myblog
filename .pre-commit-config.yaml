# Pre-commit hooks for myblog.
# Install:  pip install pre-commit && pre-commit install
# Run all:  pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.md$|^content/'
      - id: end-of-file-fixer
        exclude: '^content/|^theme/feng/static/(node_modules|bower_components)/'
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=20000"]  # source images/PDFs are legitimately large
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix"]
        files: '^(pelicanconf|publishconf|fabfile)\.py$|^tools/.*\.py$|^content/downloads/.*\.py$'
      - id: ruff-format
        files: '^(pelicanconf|publishconf|fabfile)\.py$|^tools/.*\.py$|^content/downloads/.*\.py$'

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: '^theme/feng/static/.*\.(js|jsx|css|scss|json)$'
        exclude: '(node_modules|bower_components|package-lock\.json|yarn\.lock)'
